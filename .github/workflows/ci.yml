name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Committed tailwind.css must match the source
        run: |
          npm run build:css
          git diff --exit-code tailwind.css
      - run: npx playwright install --with-deps chromium
      - run: npm test
